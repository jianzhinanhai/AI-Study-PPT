name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch AiDASH page
        run: |
          mkdir -p aidash
          curl -L --fail --retry 3 "https://at.adobe.com/ClPt7HZAytFjwolm" -o aidash/index.html
          test -s aidash/index.html
          grep -q "AiDASH" aidash/index.html

      - name: Persist AiDASH page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aidash/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish AiDASH company deep dive"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
